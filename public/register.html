<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Alpha Market</title>
    <link rel="stylesheet" href="./css/index.css">
    <link rel="stylesheet" href="./css/authenticate.css">
</head>
<body>
    <section class="main">
        <form action="">
            <h1 class="form-title">Register</h1>

            <div class="form-item">
                <label for="fname" class="field">Full Name</label>
                <input type="text" name="fname" id="fname">
            </div>
            
            <div class="form-item">
                <label for="email" class="field">Email</label>
                <input type="text" name="email" id="email">
            </div>
            
            <div class="form-item">
                <label for="password" class="field">Password</label>
                <input type="text" name="password" id="password">
            </div>
            
            <div class="form-item">
                <label for="confirm-password" class="field">Confirm Password</label>
                <input type="text" name="confirm-password" id="confirm-password">
            </div>
            <p class="text error-msg">This is error message</p>
            <button class="btn">Register</button>
        </form>
    </section>
</body>
</html>
